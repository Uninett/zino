name: Run test suite

###########################################################
# Start the job on pushes to master and all pull requests #
###########################################################
on:
  push:
    branches: master
    paths-ignore:
      - 'docs/**'
      - 'changelog.d/*'
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'changelog.d/*'
      - 'README.md'
  schedule: # Run daily at 08:00 CEST (06:00 UST)
    - cron: '0 6 * * *'

permissions:
  actions: write
  contents: read

###############
# Set the Job #
###############
jobs:
  tests:
    # Name the Job
    name: "Test on Python ${{ matrix.python-version}}"
    # Set the agent to run on
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Disable shallow clone for improved SonarCloud analysis
          persist-credentials: false

      - name: Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-


      - name: "Set up Python ${{ matrix.python-version }}"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox tox-gh-actions coverage
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends snmp libsnmp-dev

      - name: Test with tox
        run: tox

      - name: Upload test reports (${{ matrix.python-version }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-${{ matrix.python-version }}
          path: |
            reports/**/*

      - name: Upload coverage reports to Codecov
        if: github.repository_owner == 'Uninett'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
